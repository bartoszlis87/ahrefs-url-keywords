<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ahrefs URL Keywords</title></head><body><div id="loading" style="font-family:system-ui;padding:24px">Ładowanie aplikacji…</div><script>(async()=>{const html=await fetch('./app.html?v=clipboard-v1').then(r=>{if(!r.ok)throw new Error('Nie można załadować aplikacji');return r.text()});const addon=`<script>(function(){function relabel(){document.querySelectorAll('.keyword-list-download').forEach(btn=>{if(btn.dataset.clipboardReady)return;btn.dataset.clipboardReady='1';btn.textContent='Kopiuj frazy';btn.title='Kopiuj wszystkie frazy z tej listy do schowka';btn.setAttribute('aria-label','Kopiuj frazy do schowka')})}window.downloadOnlyKeywordList=async function(url){const keywords=S.assignKeywords.filter(x=>x.url===url).sort((a,b)=>a.position-b.position||b.volume-a.volume).map(x=>x.keyword).filter(Boolean);if(!keywords.length){alert('Dla tego URL-a nie znaleziono fraz do skopiowania.');return}const text=keywords.join('\n');try{if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(text)}else{const ta=document.createElement('textarea');ta.value=text;ta.style.position='fixed';ta.style.opacity='0';ta.style.pointerEvents='none';document.body.appendChild(ta);ta.focus();ta.select();const ok=document.execCommand('copy');ta.remove();if(!ok)throw new Error('copy failed')}const btn=[...document.querySelectorAll('.keyword-list-download')].find(b=>decodeURIComponent(b.dataset.url||'')===url);if(btn){btn.textContent='Skopiowano ✓';btn.disabled=true;setTimeout(()=>{btn.textContent='Kopiuj frazy';btn.disabled=false},1400)}}catch(e){alert('Nie udało się skopiować fraz do schowka. Spróbuj ponownie.')}};new MutationObserver(relabel).observe(document.body,{childList:true,subtree:true});relabel()})();<\/script>`;const out=html.replace('</body>',addon+'</body>');document.open();document.write(out);document.close()})().catch(err=>{document.getElementById('loading').textContent='Nie udało się załadować aplikacji: '+err.message});</script></body></html>
